<div class="container px-4 px-lg-5">
    <!-- Heading Row-->
    <div class="row gx-4 gx-lg-5 align-items-center my-5">
        <div class="col-lg-7"><img class="img-fluid rounded mb-4 mb-lg-0" src="images/borrowing_books_2_900x400.jpg" alt="..." /></div>
        <div class="col-lg-5">
            <div class="section-header align-center">
                <div class="title">
                    <span>Some quality items</span>
                </div>
                <h2 style="font-size: 3em; font-weight: 500; line-height: 1;">Popular Books</h2>
            </div>        
        </div>
    </div>
    <!-- Content Row-->
    <div class="row gx-4 gx-lg-5" id="featured-books-container">
        <!-- Featured books will be loaded here dynamically -->
    </div>
</div>

<script>
    $(document).ready(function() {
        // Function to render featured books
        function renderFeaturedBooks(books) {
            const container = $('#featured-books-container');
            container.empty(); // Clear existing content

            if (books && books.length > 0) {
                books.forEach(book => {
                    const bookHtml = `
                        <div class="col-md-4 mb-5">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h2 class="card-title">${book.title}</h2>
                                    <img src="images/${book.image}" class="card-img-top mb-3" alt="${book.title}" style="height: 300px; object-fit: cover;">
                                </div>
                                <div class="card-footer"><a class="btn btn-primary btn-sm" href="#single-book?id=${book.id}">Read More</a></div>
                            </div>
                        </div>
                    `;
                    container.append(bookHtml);
                });
            } else {
                container.html('<p>No featured books found.</p>');
            }
        }

        // Function to fetch and display featured books
        function fetchAndDisplayFeaturedBooks() {
            // Fetch featured books directly from the dedicated endpoint
            BookService.getFeaturedBooks(function(books) {
                renderFeaturedBooks(books);
            }, function(error) {
                console.error('Error fetching featured books:', error);
                $('#featured-books-container').html('<p>Error loading featured books.</p>');
            });
        }

        // Initial load of featured books
        fetchAndDisplayFeaturedBooks();
    });
</script>
