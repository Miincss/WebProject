<section id="popular-books" class="bookshelf py-5 my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="section-header align-center">
                    <div class="title">
                        <span>Some quality items</span>
                    </div>
                    <h2 class="section-title">All Genres</h2>
                </div>

                <ul class="tabs">
                    <li data-tab-target="#all-genre" class="active tab">All Genre</li>
                    <li data-tab-target="#business" class="tab">Business</li>
                    <li data-tab-target="#technology" class="tab">Technology</li>
                    <li data-tab-target="#romantic" class="tab">Romantic</li>
                    <li data-tab-target="#adventure" class="tab">Adventure</li>
                    <li data-tab-target="#fictional" class="tab">Fictional</li>
                </ul>

                <div class="tab-content">
                    <div id="all-genre" data-tab-content class="active">
                        <div class="row" id="all-genre-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>
                    <div id="business" data-tab-content>
                        <div class="row" id="business-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>

                    <div id="technology" data-tab-content>
                        <div class="row" id="technology-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>

                    <div id="romantic" data-tab-content>
                        <div class="row" id="romantic-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>

                    <div id="adventure" data-tab-content>
                        <div class="row" id="adventure-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>

                    <div id="fictional" data-tab-content>
                        <div class="row" id="fictional-books-container">
                            <!-- Books will be loaded here dynamically -->
                        </div>
                    </div>

                </div>

            </div><!--inner-tabs-->

        </div>
    </div>
</section>

<script>
    $(document).ready(function() {
        // Function to render books
        function renderBooks(books, containerId) {
            const container = $(containerId);
            container.empty(); // Clear existing content

            if (books && books.length > 0) {
                books.forEach(book => {
                    const bookHtml = `
                        <div class="col-md-3">
                            <div class="product-item">
                                <figure class="product-style">
                                    <img src="images/${book.image}" style="height: 345px;" alt="${book.title}" class="product-item">
                                    <button type="button" class="add-to-cart" data-product-tile="add-to-cart" onclick="window.location.href='#single-book?id=${book.id}'">Read More</button>
                                </figure>
                                <figcaption>
                                    <h3>${book.title}</h3>
                                    <span>${book.author}</span>
                                </figcaption>
                            </div>
                        </div>
                    `;
                    container.append(bookHtml);
                });
            } else {
                container.html('<p>No books found for this genre.</p>');
            }
        }

        // Function to fetch and display books for a specific genre
        function fetchAndDisplayBooks(genre, containerId) {
            // In a real application, you would filter books by genre here
            // For now, we'll fetch all books and filter on the frontend
            BookService.getAllBooks(function(books) {
                let filteredBooks = books;
                if (genre !== 'all-genre') {
                    filteredBooks = books.filter(book => book.genre && book.genre.toLowerCase() === genre.toLowerCase());
                }
                renderBooks(filteredBooks, containerId);
            }, function(error) {
                console.error('Error fetching books:', error);
                $(containerId).html('<p>Error loading books.</p>');
            });
        }

        // Initial load for the default active tab (All Genre)
        fetchAndDisplayBooks('all-genre', '#all-genre-books-container');

        // Add event listeners to tabs
        $('.tabs .tab').on('click', function() {
            const targetId = $(this).data('tab-target');
            const genre = targetId.replace('#', '').replace('-books-container', ''); // Extract genre from targetId
            const containerId = targetId + '-books-container'; // Construct container ID
            fetchAndDisplayBooks(genre, containerId);
        });

    });
</script>
